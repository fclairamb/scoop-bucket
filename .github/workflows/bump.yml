name: bump
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the manifest to the latest solidping release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/bump.py
          if ! git diff --quiet; then
            version="$(python3 -c 'import json;print(json.load(open("bucket/solidping.json"))["version"])')"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "solidping: update to $version"
            git push
          fi
